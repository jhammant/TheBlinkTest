[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkcounter"
version = "0.1.0"
description = "Analyze blink rates in videos to detect anomalous patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "face-recognition>=1.3.0",
    "yt-dlp>=2024.0",
    "PyQt6>=6.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
blinkcounter = "blinkcounter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
